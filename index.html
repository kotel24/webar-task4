<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Задание 4</title>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js" } }
  </script>
</head>
<body>
  <button id="start">Запустить AR</button>

  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3));

    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x00ff88 })
    );
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(0.2, 0.2, 0.2).translate(0, 0.1, 0),
      new THREE.MeshStandardMaterial({ color: 0xff5533 })
    );
    cube.visible = false;
    scene.add(cube);

    let hitTestSource = null;

    document.getElementById('start').addEventListener('click', async () => {
      const supported = navigator.xr && await navigator.xr.isSessionSupported('immersive-ar');
      if (!supported) {
        alert('Это устройство не поддерживает WebXR AR');
        return;
      }

      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['local-floor']
      });
      await renderer.xr.setSession(session);

      const viewerSpace = await session.requestReferenceSpace('viewer');
      hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

      session.addEventListener('select', () => {
        if (reticle.visible) {
          cube.position.setFromMatrixPosition(reticle.matrix);
          cube.visible = true;
        }
      });

      session.addEventListener('end', () => {
        hitTestSource = null;
        reticle.visible = false;
      });
    });

    renderer.setAnimationLoop((time, frame) => {
      if (frame && hitTestSource) {
        const results = frame.getHitTestResults(hitTestSource);
        if (results.length > 0) {
          const pose = results[0].getPose(renderer.xr.getReferenceSpace());
          reticle.matrix.fromArray(pose.transform.matrix);
          reticle.visible = true;
        } else {
          reticle.visible = false;
        }
      }
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
